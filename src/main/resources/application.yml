# Toda la configuración que cambia entre entornos llega por variables de entorno (ABB-17, CN-23).
spring:
  application:
    name: uco-kudos-api

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Expone /actuator/health/liveness y /readiness para las sondas de la plataforma (ADR-022).
      probes:
        enabled: true
  info:
    env:
      enabled: true

# La versión es la etiqueta de la imagen (el commit). Sirve para comprobar qué quedó desplegado y
# cronometrar la vuelta atrás (ESC-15).
info:
  app:
    version: ${APP_VERSION:local}
